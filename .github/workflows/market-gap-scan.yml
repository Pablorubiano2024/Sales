name: Market Gap Scan

# Runs scripts/run_market_gap_scan.py: captures a real Buy Box snapshot
# (seller count, winning price) for every APPROVED/PROMISING Opportunity
# that has a real MercadoLibre catalog match, and raises a MarketGapEvent
# when something real changed since the last snapshot. READ-ONLY against
# MercadoLibre (only GET calls) — never publishes or modifies a listing.
#
# Unlike discover/publish/sync, this job has no ordering dependency on
# the other daily workflows, so it doesn't try to compensate for the
# ~4.5h scheduled-run delay documented in discover-opportunities.yml's
# cron comment (confirmed live 2026-09-26) — landing a few hours later
# than the nominal slot doesn't break anything here.
#
# Once a day (was every 6 hours until 2026-10-22): it's the heaviest
# writer to the database and only feeds analytics/opportunity scoring —
# prices and pauses come from the stock check and the daily optimizer.
# Cut to stay inside Neon's free 5 GB monthly transfer.
#
# Requires these repo secrets (Settings -> Secrets and variables ->
# Actions): DATABASE_URL, ML_CLIENT_ID, ML_CLIENT_SECRET, ML_REDIRECT_URI
# (same MercadoLibre app credentials the other workflows use), and
# optionally SLACK_WEBHOOK_URL (Autopilot Phase 6 — a real market gap
# event detected here is what triggers a "🚨 GOLD OPPORTUNITY" Slack
# alert when the opportunity also clears score >= 90 and margin >= 25%;
# see backend/app/services/gold_opportunity_alerts.py). Without that
# secret, alerts are silently skipped — the scan itself still runs.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  market-gap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      - name: Run market gap scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: poetry run python scripts/run_market_gap_scan.py
