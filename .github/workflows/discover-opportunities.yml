name: Discover opportunities

# Runs every real retail-arbitrage discovery script daily, before publish
# (publish-marketplace-listings.yml) and sync (sync-marketplace-
# listings.yml) — keeps the "approved" pool that daily publishing draws
# from from running dry. Sources run in parallel groups (see `jobs`), and
# one source failing never stops the others.
#
# CJdropshipping is deliberately NOT included here: its opportunities use
# an estimated (not verified) sell price, so they're excluded from the
# automated mass-publish flow (see publish_approved_opportunities.py's
# SUPPORTED_SOURCES) — no point auto-discovering what won't get published.
#
# Requires the same repo secrets as the other two workflows (Settings ->
# Secrets and variables -> Actions): DATABASE_URL, ML_CLIENT_ID,
# ML_CLIENT_SECRET, ML_REDIRECT_URI — discovery itself doesn't call
# MercadoLibre, but backend.app.core.config.Settings loads them all
# together and a startup failure on a missing one would block everything.

on:
  schedule:
    # Target real fire time: 06:00 America/Bogota (11:00 UTC). Scheduled
    # for 06:30 UTC instead — confirmed live 2026-09-26 that this repo's
    # scheduled runs fire a consistent ~4.5h late (sync-marketplace-
    # listings.yml fired at ~16:40 UTC on 3 separate days against its
    # configured 12:00 UTC, never closer). This is real GitHub Actions
    # behavior, not a bug here: scheduled runs queue behind other
    # triggers with no SLA, worse for low-traffic repos. Scheduling
    # ~4.5h earlier than desired aims the actual run at ~11:00 UTC —
    # still before publish and sync. Revisit if the delay pattern changes.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

jobs:
  # Run sequentially in one job, all 7 sources took ~5-6h and hit GitHub's
  # 6h job limit every other day (2026-10-11/13/15: cancelled mid-Ktronix,
  # Tecnologia Mayorista never ran). Now one job per group, in parallel.
  # Sources that sell the SAME items stay sequential inside one group, so
  # two jobs never race to create the same Product: Alkosto/Ktronix share
  # one catalog, Falabella/Homecenter one company, Jumbo resells Imusa.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: falabella-homecenter
            scripts: discover_falabella.py discover_homecenter.py
          - name: alkosto-ktronix
            scripts: discover_alkosto.py discover_ktronix.py
          - name: imusa-jumbo
            scripts: discover_imusa.py discover_jumbo.py
          - name: tecnologiamayorista
            scripts: discover_tecnologiamayorista.py
    name: discover (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      # One source having a bad day (a site hiccup, a schema change)
      # doesn't stop the next one in its group.
      - name: Discover ${{ matrix.group.name }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          status=0
          for script in ${{ matrix.group.scripts }}; do
            echo "::group::$script"
            poetry run python "scripts/$script" || { echo "::warning::$script failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
