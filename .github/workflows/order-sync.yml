name: Order Sync

# Runs scripts/run_order_sync.py: polls real MercadoLibre sales
# (GET /orders/search, read-only) and routes each new one to a supplier
# in Sandbox mode (backend/app/services/order_router.py) — pure internal
# bookkeeping, never touches a supplier's site or completes any real
# payment. Assisted mode (Playwright) is not implemented yet — see that
# module's docstring.
#
# No ordering dependency on the other daily workflows, so — like
# market-gap-scan.yml — this doesn't try to compensate for the ~4.5h
# scheduled-run delay documented in discover-opportunities.yml's cron
# comment (confirmed live 2026-09-26). Runs more often than the market
# gap scan since catching a real sale promptly matters more than Buy Box
# freshness; still the finest reasonable cadence given that delay, not
# the user's original 15-minute ask.
#
# Requires these repo secrets (Settings -> Secrets and variables ->
# Actions): DATABASE_URL, ML_CLIENT_ID, ML_CLIENT_SECRET, ML_REDIRECT_URI
# (same MercadoLibre app credentials the other workflows use).

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  order-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      - name: Run order sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
        run: poetry run python scripts/run_order_sync.py
