name: Stock check

# Frequent stock check, between the daily sync-marketplace-listings.yml
# runs. Protects MercadoLibre's "Programa de despegue" (activated
# 2026-10-15): 5 "ventas afectadas" (claims, seller cancellations, late
# shipments) end it, and selling something the source no longer has means
# cancelling. So:
#   1. scripts/sync_marketplace_listings.py — re-checks every listing's
#      origin source; pauses what went out of stock / stopped being viable.
#   0. scripts/notify_sales.py — imports new sales and alerts Slack,
#      repeating every run until someone reacts ✅.
#   2. scripts/optimize_listings.py --only-paused — reactivates paused
#      listings that are back in stock and clear the ROI gate. Active
#      listings are NOT repriced here; that stays daily.
#
# Cadence: each run dispatches the next one ~15 minutes after it started
# (last step). The cron alone was not enough: GitHub throttles scheduled
# runs, and from 2026-11-11 to 11-25 this ran every 4-8 hours instead of
# every 15 minutes, which also left the 6-hour MercadoLibre token expired
# between runs. The cron stays as a backup that restarts the chain if it
# breaks. Extra chains don't pile up: the concurrency group lets only one
# run go plus one wait, and the waiting slot is replaced, not stacked.
# To stop the chain: set the repo variable STOCK_CHECK_CHAIN=off (or
# cancel the running run). Free: the repo is public. Note GitHub disables
# schedules after 60 days without repo activity.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Never overlap with itself. Deliberately NOT shared with the daily sync:
# GitHub keeps one pending run per group, so a queued check would cancel
# the waiting daily run (and its repricing).
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    # Up to ~5 min of checks + the wait before dispatching the next run.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write  # dispatch the next run
    steps:
      - name: Note start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      - name: Alert new sales on Slack
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SALES_CHANNEL: ${{ secrets.SLACK_SALES_CHANNEL }}
        run: poetry run python scripts/notify_sales.py

      - name: Check stock (pause what's gone)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
        run: poetry run python scripts/sync_marketplace_listings.py

      - name: Reactivate what's back
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
        run: poetry run python scripts/optimize_listings.py --confirm --only-paused

      # Runs even if a check failed (so one bad fetch doesn't break the
      # chain), but not when the run was cancelled — cancelling stops it.
      - name: Schedule the next check
        if: ${{ !cancelled() && vars.STOCK_CHECK_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED ))
          wait=$(( 900 - elapsed ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run stock-check.yml --repo "$GITHUB_REPOSITORY" --ref main
