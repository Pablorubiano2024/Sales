name: Publish approved opportunities

# Runs scripts/publish_approved_opportunities.py --confirm once a day:
# publishes every real "approved" Opportunity that isn't already live and
# passes the real checks (category attributes, real photo, real
# category-specific commission still leaves it profitable). Runs 30
# minutes before the daily sync (sync-marketplace-listings.yml) so a
# freshly published item is already tracked by the time sync runs. See
# that script's docstring for the full logic — in particular, this
# publishes under "Clásica" (gold_special), not "free": the free tier's
# quota is a real, scarce cap shared across every free listing the
# account holds at once, not a daily allowance, so it can't support
# ongoing daily publishing (confirmed live 2026-09-25).
#
# Requires the same repo secrets as sync-marketplace-listings.yml
# (Settings -> Secrets and variables -> Actions): DATABASE_URL,
# ML_CLIENT_ID, ML_CLIENT_SECRET, ML_REDIRECT_URI.
#
# This is a real, consequential job — every run can create genuine public
# MercadoLibre listings under the connected seller account. It does NOT
# run discovery first, so it only draws from whatever Opportunities are
# already "approved" in the database — discover-opportunities.yml runs
# before this one to keep that pool from running dry.

on:
  schedule:
    # Target real fire time: 06:30 America/Bogota (11:30 UTC). Scheduled
    # for 07:00 UTC instead — same ~4.5h scheduled-run delay documented
    # in discover-opportunities.yml's cron comment, confirmed live
    # 2026-09-26. Still runs after discover (06:30 UTC cron) and before
    # sync (07:30 UTC cron) in real fire order.
    - cron: "0 7 * * *"
    # Black Friday week: publish after each extra discovery run (see
    # discover-opportunities.yml). Remove after 2026-12-01.
    - cron: "30 1,13,19 24-30 11 *"
    - cron: "30 1,13,19 1 12 *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-root --only main

      - name: Publish approved opportunities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
        run: |
          set -o pipefail
          poetry run python scripts/publish_approved_opportunities.py --confirm | tee publish.log
          ids=$(grep '^PUBLICADA ' publish.log | grep -oE ': MCO[0-9]+ ' | grep -oE 'MCO[0-9]+' | tr '\n' ' ' || true)
          echo "NEW_ITEMS=$ids" >> "$GITHUB_ENV"

      # A video for each new listing (ML flags listings without one as lower
      # quality). ML's upload API answers 403 for this account, so the files
      # go to the run's artifacts and Slack gets the link to upload them by
      # hand (user, 2026-11-19).
      - name: Make videos for new listings
        if: env.NEW_ITEMS != ''
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          poetry run python scripts/make_listing_videos.py $NEW_ITEMS

      - name: Upload videos
        id: videos
        if: env.NEW_ITEMS != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: data/videos/*.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Tell Slack
        if: env.NEW_ITEMS != '' && steps.videos.outputs.artifact-url != ''
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SALES_CHANNEL: ${{ secrets.SLACK_SALES_CHANNEL }}
          ARTIFACT_URL: ${{ steps.videos.outputs.artifact-url }}
        run: |
          text=$(printf '🎬 *Videos para las publicaciones nuevas:* %s\nDescarga (14 días): %s\nSúbelos en MercadoLibre → Publicaciones → Video.' "$NEW_ITEMS" "$ARTIFACT_URL")
          jq -n --arg c "$SLACK_SALES_CHANNEL" --arg t "$text" '{channel: $c, text: $t}' |
            curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" -d @- | jq -c '{ok, error}'
